<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Glow Gradients -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22E6D8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#12B8AE" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22E6D8"/>
      <stop offset="50%" stop-color="#12B8AE"/>
      <stop offset="100%" stop-color="#0A8780"/>
    </linearGradient>

    <linearGradient id="tealDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12B8AE"/>
      <stop offset="100%" stop-color="#096560"/>
    </linearGradient>

    <linearGradient id="whiteChassis" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#D6E0EA"/>
    </linearGradient>

    <linearGradient id="visorBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232E3C"/>
      <stop offset="40%" stop-color="#151D28"/>
      <stop offset="100%" stop-color="#0A0F16"/>
    </linearGradient>

    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B233C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g id="previx-robot" filter="url(#softShadow)">
    <!-- Right Arm (Pointing welcomingly forward/left in 3/4 view) -->
    <g id="right-arm">
      <!-- Arm Joint / Shoulder -->
      <path d="M145 285 Q115 270 95 300 Q80 325 105 340 Q130 350 150 315 Z" fill="url(#whiteChassis)" stroke="#D6E0EA" stroke-width="1.5"/>
      <!-- Forearm extending and pointing -->
      <path d="M100 310 Q65 295 45 270 Q35 255 42 245 Q52 240 68 258 Q88 280 110 295 Z" fill="url(#whiteChassis)"/>
      <path d="M72 262 Q55 248 42 245 Q36 248 38 256 Q48 275 68 290 Z" fill="#151D28"/>
      <!-- Pointing finger -->
      <path d="M42 245 Q36 230 42 225 Q48 222 55 238 Z" fill="#151D28"/>
      <ellipse cx="48" cy="235" rx="5" ry="9" fill="#151D28" transform="rotate(-20 48 235)"/>
      <!-- Teal accent on shoulder -->
      <ellipse cx="120" cy="305" rx="14" ry="7" fill="url(#tealGrad)" transform="rotate(-30 120 305)"/>
    </g>

    <!-- Left Arm (Resting at side) -->
    <g id="left-arm">
      <path d="M370 300 Q425 320 445 365 Q455 390 435 405 Q415 415 395 380 Q375 350 355 330 Z" fill="url(#whiteChassis)"/>
      <!-- Teal accent on left arm -->
      <ellipse cx="415" cy="360" rx="8" ry="16" fill="url(#tealGrad)" transform="rotate(35 415 360)"/>
      <!-- Hand fingers -->
      <path d="M430 395 Q450 415 440 430 Q425 435 415 410 Z" fill="#151D28"/>
      <circle cx="438" cy="415" r="5" fill="#151D28"/>
      <circle cx="425" cy="425" r="5" fill="#151D28"/>
      <circle cx="410" cy="428" r="4.5" fill="#151D28"/>
    </g>

    <!-- Lower Body / Hover Base -->
    <g id="lower-body">
      <!-- Outer White Torso Pod -->
      <path d="M190 320 C180 390 200 455 256 475 C312 455 332 390 322 320 Z" fill="url(#whiteChassis)"/>
      <!-- Inner Teal Core -->
      <path d="M205 340 C198 395 215 445 256 460 C297 445 314 395 307 340 Z" fill="url(#tealGrad)"/>
      <!-- Bottom glow base -->
      <ellipse cx="256" cy="455" rx="28" ry="12" fill="#0A7770"/>
      <ellipse cx="256" cy="458" rx="18" ry="6" fill="#22E6D8" opacity="0.8"/>

      <!-- PREVI Stylized Emblem on Chest -->
      <g id="previ-chest-emblem" transform="translate(232, 355) scale(0.6)">
        <path d="M12 8 L24 2 L38 12 L38 24 L24 34 L12 24 Z" fill="#FFFFFF" opacity="0.95"/>
        <path d="M18 12 L24 8 L32 14 L24 20 Z" fill="#12B8AE"/>
        <path d="M28 22 L34 18 L42 24 L34 30 Z" fill="#FFFFFF" opacity="0.95"/>
      </g>
    </g>

    <!-- Head Helmet & Headset -->
    <g id="head-assembly">
      <!-- Headset Left Ear Dome -->
      <ellipse cx="400" cy="190" rx="34" ry="50" fill="url(#tealDarkGrad)"/>
      <ellipse cx="406" cy="190" rx="20" ry="36" fill="url(#tealGrad)"/>
      <ellipse cx="408" cy="190" rx="10" ry="20" fill="#0A6C66"/>

      <!-- Headset Right Ear Dome -->
      <ellipse cx="108" cy="205" rx="24" ry="40" fill="url(#tealDarkGrad)"/>
      <ellipse cx="104" cy="205" rx="14" ry="28" fill="url(#tealGrad)"/>

      <!-- Main Helmet Outer Shell (Teal Top/Back) -->
      <path d="M130 190 C120 90 200 45 270 45 C350 45 420 95 410 200 C405 270 340 295 260 295 C175 295 135 265 130 190 Z" fill="url(#tealGrad)"/>

      <!-- White Inner Helmet Face Surround -->
      <path d="M140 185 C132 105 200 62 268 62 C340 62 396 108 390 192 C385 255 330 282 262 282 C185 282 145 250 140 185 Z" fill="url(#whiteChassis)"/>

      <!-- Dark Visor Screen Face -->
      <rect x="162" y="98" width="206" height="152" rx="65" ry="65" fill="url(#visorBg)" stroke="#151D28" stroke-width="4"/>

      <!-- Glass Visor Reflection -->
      <path d="M175 115 C215 105 315 105 355 115 C345 138 310 148 265 148 C215 148 185 135 175 115 Z" fill="url(#visorGlass)"/>

      <!-- Glowing Cyan Smiling Eyes -->
      <g id="visor-eyes" filter="url(#eyeGlow)">
        <!-- Left Eye -->
        <ellipse cx="218" cy="162" rx="13" ry="18" fill="#22E6D8"/>
        <ellipse cx="216" cy="158" rx="4" ry="6" fill="#FFFFFF" opacity="0.9"/>

        <!-- Right Eye -->
        <ellipse cx="308" cy="162" rx="13" ry="18" fill="#22E6D8"/>
        <ellipse cx="306" cy="158" rx="4" ry="6" fill="#FFFFFF" opacity="0.9"/>

        <!-- Cheerful Open Smiling Mouth -->
        <path d="M242 195 Q263 218 284 195 Q263 228 242 195 Z" fill="#22E6D8"/>
        <path d="M248 196 Q263 214 278 196" fill="#22E6D8" stroke="#22E6D8" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- Glossy Highlight on Top of White Helmet -->
      <path d="M210 68 C240 60 295 60 325 68 C310 75 285 78 268 78 C250 78 225 75 210 68 Z" fill="#FFFFFF" opacity="0.75"/>
    </g>
  </g>
</svg>
